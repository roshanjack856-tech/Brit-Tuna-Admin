<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >

  <title>Orders | Brit.Tuna Admin</title>


  <!-- Google Fonts -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >


  <!-- Admin CSS -->

  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >


  <style>

    /* ======================================================
       ADMIN ORDERS
       ====================================================== */

    .admin-orders-page {
      width: 100%;
    }


    .orders-page-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
      margin-bottom: 24px;
    }


    .orders-page-header h1 {
      margin: 0 0 6px;
      color: #173d29;
      font-family: "Fraunces", serif;
    }


    .orders-page-header p {
      margin: 0;
      color: #68736c;
      line-height: 1.6;
    }


    /* ======================================================
       MESSAGE
       ====================================================== */

    .orders-message {
      margin-bottom: 20px;
      padding: 14px 16px;
      border-radius: 12px;
      background: #f6f7f5;
      color: #49544e;
      line-height: 1.5;
    }


    .orders-message.success {
      background: #eaf7ed;
      color: #18723a;
    }


    .orders-message.error {
      background: #fff0ed;
      color: #a52f25;
    }


    /* ======================================================
       STATS
       ====================================================== */

    .orders-stats {
      display: grid;
      grid-template-columns:
        repeat(
          4,
          minmax(0, 1fr)
        );
      gap: 16px;
      margin-bottom: 22px;
    }


    .orders-stat {
      padding: 18px;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 15px;
      background: #ffffff;
    }


    .orders-stat-label {
      display: block;
      margin-bottom: 8px;
      color: #758078;
      font-size: 0.8rem;
      font-weight: 600;
    }


    .orders-stat-value {
      color: #173d29;
      font-size: 1.45rem;
      font-weight: 700;
    }


    /* ======================================================
       FILTERS
       ====================================================== */

    .orders-filters {
      display: grid;
      grid-template-columns:
        minmax(0, 2fr)
        minmax(170px, 1fr)
        minmax(170px, 1fr);
      gap: 14px;
      margin-bottom: 22px;
      padding: 18px;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 15px;
      background: #ffffff;
    }


    .orders-field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }


    .orders-field label {
      color: #4e5b53;
      font-size: 0.8rem;
      font-weight: 700;
    }


    .orders-field input,
    .orders-field select {
      width: 100%;
      min-height: 43px;
      padding: 9px 11px;
      border: 1px solid #d8ddd9;
      border-radius: 9px;
      background: #ffffff;
      color: #26332b;
      font: inherit;
    }


    /* ======================================================
       ORDER LIST
       ====================================================== */

    .orders-list {
      display: grid;
      gap: 20px;
    }


    .admin-order-card {
      padding: 22px;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 7px 25px rgba(25, 50, 35, 0.05);
    }


    .admin-order-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      padding-bottom: 17px;
      border-bottom: 1px solid #eceeea;
    }


    .admin-order-header h2 {
      margin: 0 0 5px;
      color: #173d29;
      font-family: "Fraunces", serif;
      font-size: 1.3rem;
    }


    .order-date {
      margin: 0;
      color: #7a827d;
      font-size: 0.83rem;
    }


    .order-amount {
      color: #1f5a3a;
      font-size: 1.3rem;
      font-weight: 700;
      white-space: nowrap;
    }


    /* ======================================================
       STATUS BADGES
       ====================================================== */

    .order-badges {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 16px 0;
    }


    .status-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 0.76rem;
      font-weight: 700;
      text-transform: capitalize;
      background: #eef4ef;
      color: #1f5a3a;
    }


    .status-badge.pending {
      background: #fff3df;
      color: #8a5a0a;
    }


    .status-badge.confirmed {
      background: #e9f5ec;
      color: #1f6d3c;
    }


    .status-badge.processing {
      background: #e8f1ff;
      color: #245ea8;
    }


    .status-badge.shipped {
      background: #eee8ff;
      color: #6340a5;
    }


    .status-badge.delivered {
      background: #e8f7ec;
      color: #18723a;
    }


    .status-badge.cancelled {
      background: #fff0ed;
      color: #a52f25;
    }


    .status-badge.paid {
      background: #e8f7ec;
      color: #18723a;
    }


    .status-badge.failed {
      background: #fff0ed;
      color: #a52f25;
    }


    .status-badge.refunded {
      background: #f1f2f1;
      color: #59635d;
    }


    /* ======================================================
       CUSTOMER INFORMATION
       ====================================================== */

    .order-info-grid {
      display: grid;
      grid-template-columns:
        repeat(
          3,
          minmax(0, 1fr)
        );
      gap: 14px;
      margin-bottom: 18px;
    }


    .order-info-box {
      padding: 13px;
      border-radius: 11px;
      background: #f8faf8;
    }


    .order-info-label {
      display: block;
      margin-bottom: 5px;
      color: #7b837e;
      font-size: 0.74rem;
      font-weight: 600;
    }


    .order-info-value {
      color: #2d3931;
      font-weight: 700;
      overflow-wrap: anywhere;
    }


    .order-info-box.address {
      grid-column: 1 / -1;
    }


    /* ======================================================
       ADMIN STATUS CONTROL
       ====================================================== */

    .admin-status-control {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-wrap: wrap;
      margin: 18px 0;
      padding: 15px;
      border-radius: 12px;
      background: #f7f9f7;
    }


    .admin-status-field {
      flex: 1;
      min-width: 200px;
    }


    .admin-status-field label {
      display: block;
      margin-bottom: 6px;
      color: #4e5b53;
      font-size: 0.8rem;
      font-weight: 700;
    }


    .admin-status-field select {
      width: 100%;
      min-height: 42px;
      padding: 9px 11px;
      border: 1px solid #d8ddd9;
      border-radius: 9px;
      background: #ffffff;
      font: inherit;
    }


    .admin-update-button {
      min-height: 42px;
      padding: 9px 15px;
      border: 0;
      border-radius: 9px;
      background: #1f5a3a;
      color: #ffffff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }


    .admin-update-button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }


    .status-update-message {
      width: 100%;
      margin-top: 5px;
      font-size: 0.8rem;
    }


    .status-update-message.success {
      color: #18723a;
    }


    .status-update-message.error {
      color: #a52f25;
    }


    /* ======================================================
       ITEMS TABLE
       ====================================================== */

    .order-table-wrap {
      overflow-x: auto;
      margin-top: 17px;
    }


    .order-table {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
    }


    .order-table th,
    .order-table td {
      padding: 13px 12px;
      border-bottom: 1px solid #eceeea;
      text-align: left;
      vertical-align: top;
    }


    .order-table th {
      color: #68736c;
      background: #f8faf8;
      font-size: 0.76rem;
      font-weight: 700;
    }


    .product-name {
      display: block;
      margin-bottom: 5px;
      color: #29352e;
      font-weight: 700;
    }


    .product-meta {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 5px;
    }


    .product-meta-text {
      color: #747d77;
      font-size: 0.74rem;
    }


    .pack-badge {
      display: inline-flex;
      align-items: center;
      padding: 5px 8px;
      border-radius: 7px;
      background: #edf5ef;
      color: #1f5a3a;
      font-size: 0.75rem;
      font-weight: 700;
    }


    /* ======================================================
       SELLER FULFILLMENT
       ====================================================== */

    .seller-fulfillment {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 6px 9px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: capitalize;
    }


    .seller-fulfillment.pending {
      background: #fff3df;
      color: #8a5a0a;
    }


    .seller-fulfillment.processing {
      background: #e8f1ff;
      color: #245ea8;
    }


    .seller-fulfillment.shipped {
      background: #eee8ff;
      color: #6340a5;
    }


    .seller-fulfillment.delivered {
      background: #e8f7ec;
      color: #18723a;
    }


    .seller-fulfillment.cancelled {
      background: #fff0ed;
      color: #a52f25;
    }


    .seller-fulfillment.unknown {
      background: #f1f2f1;
      color: #59635d;
    }


    /* ======================================================
       ORDER TOTAL
       ====================================================== */

    .seller-items-total {
      display: flex;
      justify-content: flex-end;
      margin-top: 17px;
    }


    .seller-items-total-inner {
      text-align: right;
    }


    .seller-items-total-label {
      color: #717b75;
      font-size: 0.78rem;
    }


    .seller-items-total-value {
      display: block;
      margin-top: 4px;
      color: #1f5a3a;
      font-size: 1.15rem;
      font-weight: 700;
    }


    /* ======================================================
       INFO NOTE
       ====================================================== */

    .order-note {
      margin-top: 18px;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f8faf8;
      color: #66716a;
      font-size: 0.78rem;
      line-height: 1.6;
    }


    .order-note strong {
      color: #1f5a3a;
    }


    /* ======================================================
       EMPTY
       ====================================================== */

    .orders-empty {
      padding: 45px 20px;
      border: 1px solid rgba(31, 90, 58, 0.12);
      border-radius: 17px;
      background: #ffffff;
      text-align: center;
    }


    .orders-empty h2 {
      margin-top: 0;
      color: #173d29;
    }


    .orders-empty p {
      color: #737c76;
    }


    /* ======================================================
       RESPONSIVE
       ====================================================== */

    @media (max-width: 900px) {

      .orders-stats {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }


      .orders-filters {
        grid-template-columns: 1fr;
      }


      .order-info-grid {
        grid-template-columns:
          repeat(
            2,
            minmax(0, 1fr)
          );
      }

    }


    @media (max-width: 600px) {

      .orders-page-header,
      .admin-order-header {
        flex-direction: column;
      }


      .orders-stats {
        grid-template-columns: 1fr;
      }


      .order-info-grid {
        grid-template-columns: 1fr;
      }


      .order-info-box.address {
        grid-column: auto;
      }


      .admin-order-card {
        padding: 16px;
      }


      .admin-status-control {
        align-items: stretch;
        flex-direction: column;
      }


      .admin-status-field {
        min-width: 0;
      }


      .admin-update-button {
        width: 100%;
      }


      .seller-items-total {
        justify-content: flex-start;
      }


      .seller-items-total-inner {
        text-align: left;
      }

    }

  </style>

</head>


<body data-page="orders">


  <!-- ======================================================
       HEADER
       ====================================================== -->

  <div id="site-header"></div>


  <!-- ======================================================
       MAIN
       ====================================================== -->

  <main class="admin-main">

    <div class="container">


      <!-- LOADING -->

      <div
        id="page-loading"
        class="orders-message"
      >
        Loading orders...
      </div>


      <!-- MESSAGE -->

      <div
        id="page-message"
        class="orders-message"
        hidden
        role="status"
        aria-live="polite"
      ></div>


      <!-- ==================================================
           PAGE
           ================================================== -->

      <div
        id="page-content"
        class="admin-orders-page"
        hidden
      >


        <!-- PAGE HEADER -->

        <div class="orders-page-header">

          <div>

            <h1>
              Orders
            </h1>

            <p>
              Manage customer orders and monitor seller
              fulfillment across the Brit.Tuna marketplace.
            </p>

          </div>

        </div>


        <!-- STATS -->

        <section class="orders-stats">

          <article class="orders-stat">

            <span class="orders-stat-label">
              Total Orders
            </span>

            <strong
              id="total-orders"
              class="orders-stat-value"
            >

            </strong>

          </article>


          <article class="orders-stat">

            <span class="orders-stat-label">
              Pending Orders
            </span>

            <strong
              id="pending-orders"
              class="orders-stat-value"
            >
              0
            </strong>

          </article>


          <article class="orders-stat">

            <span class="orders-stat-label">
              Paid Orders
            </span>

            <strong
              id="paid-orders"
              class="orders-stat-value"
            >
              0
            </strong>

          </article>


          <article class="orders-stat">

            <span class="orders-stat-label">
              Total Order Value
            </span>

            <strong
              id="total-value"

            >

            </strong>

          </article>

        <!-- FILTERS -->

        <section class="orders-filters">

          <div class="orders-field">

            <label for="order-search">

            </label>

            <input

              id="order-search"

          </div>


          <div class="orders-field">

            <label for="order-status-filter">
              Order Status
            </label>

            <select id="order-status-filter">

              <option value="all">
                All
              </option>

              <option value="pending">
                Pending
              </option>

              <option value="confirmed">
                Confirmed
              </option>

              <option value="processing">
                Processing
              </option>

              <option value="shipped">
                Shipped
              </option>

              <option value="delivered">
                Delivered
              </option>

              <option value="cancelled">
                Cancelled
              </option>

            </select>

          </div>


          <div class="orders-field">

            <label for="fulfillment-filter">
              Seller Fulfillment
            </label>

            <select id="fulfillment-filter">

              <option value="all">
                All
              </option>

              <option value="pending">
                Pending
              </option>

              <option value="processing">
                Processing
              </option>

              <option value="shipped">
                Shipped
              </option>

              <option value="delivered">
                Delivered
              </option>

              <option value="cancelled">
                Cancelled
              </option>

            </select>

          </div>

        </section>


        <!-- EMPTY -->

        <div
          id="orders-empty"
          class="orders-empty"

        >

          <h2>
            No orders found

          <p id="orders-empty-message">
            There are no customer orders yet.
          </p>

        <!-- ORDERS -->

        <div

        ></div>


      </div>

    </div>

  </main>


  <!-- ======================================================
       FOOTER
       ====================================================== -->

  <div id="site-footer"></div>


  <!-- ======================================================
       SUPABASE
       ====================================================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <!-- ======================================================
       ADMIN FILES
       ====================================================== -->

  <script src="config.js"></script>

  <script src="supabase.js"></script>

  <script src="script.js"></script>


  <!-- ======================================================
       ADMIN ORDERS LOGIC
       ====================================================== -->

  <script>

    (function () {

      "use strict";


      /* ====================================================
         STATE
         ==================================================== */

      var orders = [];

      var updatingOrders = {};


      /* ====================================================
         ELEMENTS
         ==================================================== */

      var loadingElement =
        document.getElementById(
          "page-loading"
        );


      var pageContent =
        document.getElementById(
          "page-content"
        );


      var messageElement =
        document.getElementById(
          "page-message"
        );


      var listElement =
        document.getElementById(
          "orders-list"
        );


      var emptyElement =
        document.getElementById(
          "orders-empty"
        );


      var emptyMessageElement =
        document.getElementById(
          "orders-empty-message"
        );


      var searchInput =
        document.getElementById(
          "order-search"
        );


      var orderStatusFilter =
        document.getElementById(
          "order-status-filter"
        );


      var fulfillmentFilter =
        document.getElementById(
          "fulfillment-filter"
        );


      /* ====================================================
         HELPERS
         ==================================================== */

      function escapeHtml(value) {

        return String(
          value == null
            ? ""
            : value
        )

          .replace(
            /&/g,
            "&amp;"
          )

          .replace(
            /</g,
            "&lt;"
          )

          .replace(
            />/g,
            "&gt;"
          )

          .replace(
            /"/g,
            "&quot;"
          )

          .replace(
            /'/g,
            "&#039;"
          );

      }


      function formatMoney(value) {

        return new Intl.NumberFormat(
          "en-IN",
          {
            style: "currency",
            currency: "INR",
            maximumFractionDigits: 2
          }
        ).format(
          Number(
            value || 0
          )
        );

      }


      function formatDate(value) {

        if (!value) {
          return "-";
        }


        var date =
          new Date(
            value
          );


        if (
          Number.isNaN(
            date.getTime()
          )
        ) {
          return "-";
        }


        return new Intl.DateTimeFormat(
          "en-IN",
          {

            day:
              "2-digit",

            month:
              "short",

            year:
              "numeric",

            hour:
              "2-digit",

            minute:
              "2-digit"

          }
        ).format(
          date
        );

      }


      function normalizeStatus(
        value,
        fallback
      ) {

        return String(
          value || fallback
        )
          .trim()
          .toLowerCase();

      }


      function normalizeFulfillmentStatus(
        status
      ) {

        var value =
          normalizeStatus(
            status,
            "pending"
          );


        var allowed = [

          "pending",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        if (
          !allowed.includes(
            value
          )
        ) {

          return "unknown";

        }


        return value;

      }


      function showMessage(
        text,
        type
      ) {

        messageElement.textContent =
          text;


        messageElement.className =
          "orders-message";


        if (type) {

          messageElement.classList.add(
            type
          );

        }


        messageElement.hidden =
          false;

      }


      function hideMessage() {

        messageElement.hidden =
          true;

      }


      /* ====================================================
         ADMIN AUTH
         ==================================================== */

      async function requireAdmin() {

        /*
         * If your shared admin script already exposes
         * a secure requireAdmin helper, use it.
         */

        if (
          window.BTAdmin &&
          typeof window.BTAdmin.requireAdmin ===
            "function"
        ) {

          return await window.BTAdmin
            .requireAdmin();

        }


        /*
         * Fallback:
         * session + profiles.role check.
         */

        var sessionResult =
          await window.supabaseClient
            .auth
            .getSession();


        if (
          sessionResult.error
        ) {

          throw sessionResult.error;

        }


        var session =
          sessionResult.data &&
          sessionResult.data.session;


        if (
          !session ||
          !session.user
        ) {

          window.location.href =
            "login.html";

          return null;

        }


        var profileResult =
          await window.supabaseClient

            .from(
              "profiles"
            )

            .select(
              "id, full_name, role"
            )

            .eq(
              "id",
              session.user.id
            )

            .maybeSingle();


        if (
          profileResult.error
        ) {

          throw profileResult.error;

        }


        if (
          !profileResult.data ||
          profileResult.data.role !==
            "admin"
        ) {

          throw new Error(
            "Admin access required."
          );

        }


        return {

          user:
            session.user,

          profile:
            profileResult.data

        };

      }


      /* ====================================================
         BADGES
         ==================================================== */

      function statusBadgeHtml(
        status,
        label
      ) {

        var value =
          normalizeStatus(
            status,
            "pending"
          );


        return `

          <span
            class="status-badge ${escapeHtml(
              value
            )}"
          >

            ${escapeHtml(
              label
            )}:
            ${escapeHtml(
              value
            )}

          </span>

        `;

      }


      function fulfillmentBadgeHtml(
        status
      ) {

        var value =
          normalizeFulfillmentStatus(
            status
          );


        return `

          <span
            class="seller-fulfillment ${escapeHtml(
              value
            )}"
          >

            ${escapeHtml(
              value
            )}

          </span>

        `;

      }


      /* ====================================================
         LOAD ORDERS
         ==================================================== */

      async function loadOrders() {

        /*
         * Admin RLS policies must allow:
         * orders SELECT
         * order_items SELECT
         */

        var result =
          await window.supabaseClient

            .from(
              "orders"
            )

            .select(
              `

              id,

              user_id,

              customer_name,

              customer_phone,

              shipping_address,

              city,

              state,

              pincode,

              total_amount,

              payment_status,

              order_status,

              payment_method,

              created_at,

              order_items (

                id,

                product_id,

                variant_id,

                seller_id,

                product_name,

                pack_size,

                price,

                quantity,

                fulfillment_status,

                created_at

              )

              `
            )

            .order(
              "created_at",
              {
                ascending: false
              }
            );


        if (
          result.error
        ) {

          throw result.error;

        }


        orders =
          result.data || [];


        console.log(
          "Brit.Tuna Admin Orders:",
          orders
        );

      }


      /* ====================================================
         STATS
         ==================================================== */

      function renderStats() {

        var totalOrders =
          orders.length;


        var pendingOrders =
          orders.filter(
            function (order) {

              return (
                normalizeStatus(
                  order.order_status,
                  "pending"
                ) ===
                "pending"
              );

            }
          ).length;


        var paidOrders =
          orders.filter(
            function (order) {

              return (
                normalizeStatus(
                  order.payment_status,
                  "pending"
                ) ===
                "paid"
              );

            }
          ).length;


        var totalValue =
          orders.reduce(
            function (
              total,
              order
            ) {

              return (
                total +
                Number(
                  order.total_amount ||
                  0
                )
              );

            },
            0
          );


        document.getElementById(
          "total-orders"
        ).textContent =
          String(
            totalOrders
          );


        document.getElementById(
          "pending-orders"
        ).textContent =
          String(
            pendingOrders
          );


        document.getElementById(
          "paid-orders"
        ).textContent =
          String(
            paidOrders
          );


        document.getElementById(
          "total-value"
        ).textContent =
          formatMoney(
            totalValue
          );

      }


      /* ====================================================
         ADDRESS
         ==================================================== */

      function buildAddress(
        order
      ) {

        return [

          order.shipping_address,

          order.city,

          order.state,

          order.pincode

        ]

          .filter(Boolean)

          .join(
            ", "
          );

      }


      /* ====================================================
         PRODUCT META
         ==================================================== */

      function productMetaHtml(
        item
      ) {

        var html =
          '<div class="product-meta">';


        html += `

          <span class="product-meta-text">

            Product ID:
            ${escapeHtml(
              item.product_id ||
              "-"
            )}

          </span>

        `;


        /*
         * NEW:
         * Customer-selected pack snapshot.
         */

        if (
          item.pack_size
        ) {

          html += `

            <span class="pack-badge">

              Pack:
              ${escapeHtml(
                item.pack_size
              )}

            </span>

          `;

        }


        /*
         * NEW:
         * Exact product variant.
         */

        if (
          item.variant_id
        ) {

          html += `

            <span class="product-meta-text">

              Variant ID:
              ${escapeHtml(
                item.variant_id
              )}

            </span>

          `;

        }


        /*
         * Seller ID is useful for Admin.
         */

        if (
          item.seller_id
        ) {

          html += `

            <span class="product-meta-text">

              Seller ID:
              ${escapeHtml(
                item.seller_id
              )}

            </span>

          `;

        }


        html +=
          "</div>";


        return html;

      }


      /* ====================================================
         ORDER ITEMS
         ==================================================== */

      function renderItems(
        items
      ) {

        if (
          !Array.isArray(
            items
          ) ||
          items.length === 0
        ) {

          return `

            <tr>

              <td colspan="6">

                No order items available.

              </td>

            </tr>

          `;

        }


        return items.map(

          function (item) {

            var quantity =
              Number(
                item.quantity || 1
              );


            var price =
              Number(
                item.price || 0
              );


            var lineTotal =
              price *
              quantity;


            return `

              <tr>


                <!-- PRODUCT -->

                <td>

                  <span class="product-name">

                    ${escapeHtml(
                      item.product_name ||
                      "Product"
                    )}

                  </span>


                  ${productMetaHtml(
                    item
                  )}

                </td>


                <!-- UNIT PRICE -->

                <td>

                  ${formatMoney(
                    price
                  )}

                </td>


                <!-- QTY -->

                <td>

                  ${escapeHtml(
                    quantity
                  )}

                </td>


                <!-- TOTAL -->

                <td>

                  <strong>

                    ${formatMoney(
                      lineTotal
                    )}

                  </strong>

                </td>


                <!-- SELLER -->

                <td>

                  ${item.seller_id

                    ? escapeHtml(
                        item.seller_id
                      )

                    : '<span class="product-meta-text">Brit.Tuna / No seller</span>'
                  }

                </td>


                <!-- FULFILLMENT -->

                <td>

                  ${fulfillmentBadgeHtml(
                    item.fulfillment_status
                  )}

                </td>


              </tr>

            `;

          }

        ).join("");

      }


      /* ====================================================
         ORDER STATUS OPTIONS
         ==================================================== */

      function orderStatusOptions(
        currentStatus
      ) {

        var statuses = [

          "pending",

          "confirmed",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        var current =
          normalizeStatus(
            currentStatus,
            "pending"
          );


        return statuses.map(

          function (status) {

            return `

              <option
                value="${escapeHtml(
                  status
                )}"
                ${status === current
                  ? "selected"
                  : ""}
              >

                ${escapeHtml(
                  status.charAt(0).toUpperCase() +
                  status.slice(1)
                )}

              </option>

            `;

          }

        ).join("");

      }


      /* ====================================================
         ORDER CARD
         ==================================================== */

      function orderCardHtml(
        order
      ) {

        var items =
          Array.isArray(
            order.order_items
          )

            ? order.order_items

            : [];


        var address =
          buildAddress(
            order
          );


        var orderStatus =
          normalizeStatus(
            order.order_status,
            "pending"
          );


        var paymentStatus =
          normalizeStatus(
            order.payment_status,
            "pending"
          );


        var itemsTotal =
          items.reduce(

            function (
              total,
              item
            ) {

              return (
                total +
                (
                  Number(
                    item.price || 0
                  )
                  *
                  Number(
                    item.quantity || 0
                  )
                )
              );

            },

            0

          );


        var isUpdating =
          Boolean(
            updatingOrders[
              String(
                order.id
              )
            ]
          );


        return `

          <article
            class="admin-order-card"
            data-order-id="${escapeHtml(
              order.id
            )}"
          >


            <!-- HEADER -->

            <div class="admin-order-header">

              <div>

                <h2>

                  Order #${escapeHtml(
                    order.id
                  )}

                </h2>


                <p class="order-date">

                  ${escapeHtml(
                    formatDate(
                      order.created_at
                    )
                  )}

                </p>

              </div>


              <div class="order-amount">

                ${formatMoney(
                  order.total_amount
                )}

              </div>

            </div>


            <!-- STATUS -->

            <div class="order-badges">

              ${statusBadgeHtml(
                orderStatus,
                "Order"
              )}


              ${statusBadgeHtml(
                paymentStatus,
                "Payment"
              )}

            </div>


            <!-- CUSTOMER -->

            <div class="order-info-grid">


              <div class="order-info-box">

                <span class="order-info-label">
                  Customer
                </span>

                <div class="order-info-value">

                  ${escapeHtml(
                    order.customer_name ||
                    "-"
                  )}

                </div>

              </div>


              <div class="order-info-box">

                <span class="order-info-label">
                  Phone
                </span>

                <div class="order-info-value">

                  ${escapeHtml(
                    order.customer_phone ||
                    "-"
                  )}

                </div>

              </div>


              <div class="order-info-box">

                <span class="order-info-label">
                  Payment Method
                </span>

                <div class="order-info-value">

                  ${escapeHtml(
                    order.payment_method ||
                    "-"
                  )}

                </div>

              </div>


              <div class="order-info-box">

                <span class="order-info-label">
                  Customer User ID
                </span>

                <div class="order-info-value">

                  ${escapeHtml(
                    order.user_id ||
                    "-"
                  )}

                </div>

              </div>


              <div class="order-info-box address">

                <span class="order-info-label">
                  Delivery Address
                </span>

                <div class="order-info-value">

                  ${escapeHtml(
                    address ||
                    "-"
                  )}

                </div>

              </div>


            </div>


            <!-- ADMIN OVERALL STATUS CONTROL -->

            <div class="admin-status-control">

              <div class="admin-status-field">

                <label
                  for="order-status-${escapeHtml(
                    order.id
                  )}"
                >
                  Overall Order Status
                </label>

                <select
                  id="order-status-${escapeHtml(
                    order.id
                  )}"
                  class="admin-order-status-select"
                  data-order-id="${escapeHtml(
                    order.id
                  )}"
                  ${isUpdating
                    ? "disabled"
                    : ""}
                >

                  ${orderStatusOptions(
                    orderStatus
                  )}

                </select>

              </div>


              <button
                type="button"
                class="admin-update-button"
                data-order-id="${escapeHtml(
                  order.id
                )}"
                ${isUpdating
                  ? "disabled"
                  : ""}
              >

                ${isUpdating
                  ? "Updating..."
                  : "Update Order Status"
                }

              </button>


              <div
                id="status-message-${escapeHtml(
                  order.id
                )}"
                class="status-update-message"
                aria-live="polite"
              ></div>

            </div>


            <!-- ITEMS -->

            <div class="order-table-wrap">

              <table class="order-table">

                <thead>

                  <tr>

                    <th>
                      Product
                    </th>

                    <th>
                      Unit Price
                    </th>

                    <th>
                      Qty
                    </th>

                    <th>
                      Total
                    </th>

                    <th>
                      Seller
                    </th>

                    <th>
                      Seller Fulfillment
                    </th>

                  </tr>

                </thead>


                <tbody>

                  ${renderItems(
                    items
                  )}

                </tbody>

              </table>

            </div>


            <!-- ITEMS TOTAL -->

            <div class="seller-items-total">

              <div class="seller-items-total-inner">

                <span class="seller-items-total-label">
                  Items Total
                </span>

                <strong class="seller-items-total-value">

                  ${formatMoney(
                    itemsTotal
                  )}

                </strong>

              </div>

            </div>


            <!-- EXPLANATION -->

            <div class="order-note">

              <strong>
                Overall Order Status
              </strong>

              is controlled by Admin.

              <strong>
                Seller Fulfillment
              </strong>

              is the individual product status controlled
              by the seller.

              If one seller cancels their product, only that
              product becomes

              <strong>
                Cancelled
              </strong>

              — the entire multi-seller order is not
              automatically cancelled.

            </div>


          </article>

        `;

      }


      /* ====================================================
         FILTER ORDERS
         ==================================================== */

      function getFilteredOrders() {

        var query =
          searchInput.value
            .trim()
            .toLowerCase();


        var selectedOrderStatus =
          orderStatusFilter.value;


        var selectedFulfillment =
          fulfillmentFilter.value;


        return orders.filter(

          function (order) {

            var matchesSearch =

              !query

              ||

              String(
                order.id || ""
              )
                .toLowerCase()
                .includes(
                  query
                )

              ||

              String(
                order.customer_name || ""
              )
                .toLowerCase()
                .includes(
                  query
                )

              ||

              String(
                order.customer_phone || ""
              )
                .toLowerCase()
                .includes(
                  query
                );


            var matchesOrderStatus =

              selectedOrderStatus ===
                "all"

              ||

              normalizeStatus(
                order.order_status,
                "pending"
              ) ===
                selectedOrderStatus;


            var items =
              Array.isArray(
                order.order_items
              )

                ? order.order_items

                : [];


            var matchesFulfillment =

              selectedFulfillment ===
                "all"

              ||

              items.some(

                function (item) {

                  return (
                    normalizeFulfillmentStatus(
                      item.fulfillment_status
                    ) ===
                    selectedFulfillment
                  );

                }

              );


            return (
              matchesSearch &&
              matchesOrderStatus &&
              matchesFulfillment
            );

          }

        );

      }


      /* ====================================================
         RENDER ORDERS
         ==================================================== */

      function renderOrders() {

        var filtered =
          getFilteredOrders();


        listElement.innerHTML =
          "";


        if (
          filtered.length ===
          0
        ) {

          emptyElement.hidden =
            false;


          if (
            orders.length ===
            0
          ) {

            emptyMessageElement.textContent =
              "There are no customer orders yet.";

          }

          else {

            emptyMessageElement.textContent =
              "No orders match your current filters.";

          }


          return;

        }


        emptyElement.hidden =
          true;


        listElement.innerHTML =
          filtered.map(
            orderCardHtml
          ).join("");


        attachUpdateEvents();

      }


      /* ====================================================
         FIND ORDER
         ==================================================== */

      function findOrder(
        orderId
      ) {

        return orders.find(

          function (order) {

            return (
              String(
                order.id
              ) ===
              String(
                orderId
              )
            );

          }

        );

      }


      /* ====================================================
         STATUS MESSAGE
         ==================================================== */

      function setOrderStatusMessage(
        orderId,
        text,
        type
      ) {

        var element =
          document.getElementById(
            "status-message-" +
            orderId
          );


        if (!element) {
          return;
        }


        element.textContent =
          text || "";


        element.className =
          "status-update-message";


        if (type) {

          element.classList.add(
            type
          );

        }

      }


      /* ====================================================
         ADMIN UPDATE OVERALL ORDER STATUS
         ==================================================== */

      async function updateOrderStatus(
        orderId
      ) {

        var order =
          findOrder(
            orderId
          );


        if (!order) {
          return;
        }


        var select =
          document.getElementById(
            "order-status-" +
            orderId
          );


        if (!select) {
          return;
        }


        var newStatus =
          String(
            select.value || ""
          )
            .trim()
            .toLowerCase();


        var allowed = [

          "pending",

          "confirmed",

          "processing",

          "shipped",

          "delivered",

          "cancelled"

        ];


        if (
          !allowed.includes(
            newStatus
          )
        ) {

          setOrderStatusMessage(
            orderId,
            "Invalid order status.",
            "error"
          );

          return;

        }


        var currentStatus =
          normalizeStatus(
            order.order_status,
            "pending"
          );


        if (
          currentStatus ===
          newStatus
        ) {

          setOrderStatusMessage(
            orderId,
            "This is already the current order status."
          );

          return;

        }


        var confirmed =
          window.confirm(
            "Change Order #" +
            orderId +
            " status from \"" +
            currentStatus +
            "\" to \"" +
            newStatus +
            "\"?"
          );


        if (!confirmed) {

          select.value =
            currentStatus;

          return;

        }


        updatingOrders[
          String(
            orderId
          )
        ] = true;


        renderOrders();


        try {


          /*
           * SECURE ADMIN RPC
           */

          var result =
            await window.supabaseClient

              .rpc(
                "admin_update_order_status",
                {

                  order_id_input:
                    Number(
                      orderId
                    ),

                  new_status_input:
                    newStatus

                }
              );


          if (
            result.error
          ) {

            throw result.error;

          }


          order.order_status =
            newStatus;


          delete updatingOrders[
            String(
              orderId
            )
          ];


          renderStats();

          renderOrders();


          setTimeout(

            function () {

              setOrderStatusMessage(
                orderId,
                "Order status updated successfully.",
                "success"
              );

            },

            0

          );


        }

        catch (error) {

          console.error(
            "Admin order status update error:",
            error
          );


          delete updatingOrders[
            String(
              orderId
            )
          ];


          renderOrders();


          setTimeout(

            function () {

              setOrderStatusMessage(

                orderId,

                error &&
                error.message

                  ? error.message

                  : "Unable to update order status.",

                "error"

              );

            },

            0

          );

        }

      }


      /* ====================================================
         UPDATE BUTTON EVENTS
         ==================================================== */

      function attachUpdateEvents() {

        var buttons =
          document.querySelectorAll(
            ".admin-update-button"
          );


        buttons.forEach(

          function (button) {

            button.addEventListener(

              "click",

              function () {

                var orderId =
                  button.dataset.orderId;


                if (!orderId) {
                  return;
                }


                updateOrderStatus(
                  orderId
                );

              }

            );

          }

        );

      }


      /* ====================================================
         INITIALISE
         ==================================================== */

      async function initialise() {

        loadingElement.hidden =
          false;


        pageContent.hidden =
          true;


        hideMessage();


        try {


          if (
            !window.supabaseClient
          ) {

            throw new Error(
              "Supabase connection is not available."
            );

          }


          /*
           * ADMIN AUTH
           */

          var auth =
            await requireAdmin();


          if (!auth) {
            return;
          }


          /*
           * LOAD ORDERS
           */

          await loadOrders();


          /*
           * DISPLAY
           */

          renderStats();

          renderOrders();


          loadingElement.hidden =
            true;


          pageContent.hidden =
            false;


        }

        catch (error) {

          console.error(
            "Brit.Tuna Admin Orders error:",
            error
          );


          loadingElement.hidden =
            true;


          showMessage(

            error &&
            error.message

              ? error.message

              : "Unable to load orders.",

            "error"

          );

        }

      }


      /* ====================================================
         FILTER EVENTS
         ==================================================== */

      searchInput.addEventListener(
        "input",
        renderOrders
      );


      orderStatusFilter.addEventListener(
        "change",
        renderOrders
      );


      fulfillmentFilter.addEventListener(
        "change",
        renderOrders
      );


      /* ====================================================
         START
         ==================================================== */

      document.addEventListener(
        "DOMContentLoaded",
        initialise
      );


    })();

  </script>


</body>

</html>
