<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Brit.Tuna Admin Portal Login"
  >

  <meta
    name="theme-color"
    content="#1f5a3a"
  >

  <title>Admin Login | Brit.Tuna</title>

  <!-- Google Fonts -->
  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->
  <link
    rel="stylesheet"
    href="style.css"
  >

  <link
    rel="stylesheet"
    href="responsive.css"
  >
</head>


<body>

  <!-- HEADER -->
  <div id="site-header"></div>


  <!-- MAIN -->
  <main class="admin-main">

    <div class="container">

      <div class="auth-layout">

        <section class="auth-card">

          <!-- LOGO -->
          <div
            style="
              width:64px;
              height:64px;
              border-radius:18px;
              background:#1f5a3a;
              color:#ffffff;
              display:flex;
              align-items:center;
              justify-content:center;
              font-family:'Fraunces',serif;
              font-size:30px;
              font-weight:700;
              margin:0 auto 18px;
            "
          >
            B
          </div>


          <div
            style="
              text-align:center;
              margin-bottom:24px;
            "
          >

            <h1>
              Admin Login
            </h1>

            <p class="muted">
              Sign in to manage the Brit.Tuna marketplace.
            </p>

          </div>


          <!-- SECURITY NOTICE -->
          <div class="notice notice-info">

            <strong>Admin access only.</strong>

            Only accounts with the
            <strong>admin</strong>
            role can access this portal.

          </div>


          <!-- LOGIN MESSAGE -->
          <div
            id="login-message"
            hidden
          ></div>


          <!-- EMAIL LOGIN -->
          <form
            id="admin-login-form"
            novalidate
          >

            <div class="form-field">

              <label for="email">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                name="email"
                placeholder="admin@example.com"
                autocomplete="email"
                required
              >

              <div
                id="email-error"
                class="error"
              ></div>

            </div>


            <div class="form-field">

              <label for="password">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              >

              <div
                id="password-error"
                class="error"
              ></div>

            </div>


            <button
              id="login-button"
              class="btn btn-primary btn-block"
              type="submit"
            >
              Login as Admin
            </button>

          </form>


          <!-- DIVIDER -->
          <div
            style="
              display:flex;
              align-items:center;
              gap:12px;
              margin:24px 0;
            "
          >

            <div
              style="
                flex:1;
                height:1px;
                background:#ddd;
              "
            ></div>

            <span class="muted">
              OR
            </span>

            <div
              style="
                flex:1;
                height:1px;
                background:#ddd;
              "
            ></div>

          </div>


          <!-- GOOGLE LOGIN -->
          <button
            id="google-login-button"
            class="btn btn-outline btn-block"
            type="button"
          >
            Continue with Google
          </button>


          <!-- WARNING -->
          <div class="notice notice-warning mt-2 mb-0">

            There is no public Admin registration.

            Admin permission must be assigned securely
            through the database.

          </div>

        </section>

      </div>

    </div>

  </main>


  <!-- FOOTER -->
  <div id="site-footer"></div>


  <!-- SUPABASE LIBRARY -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- PROJECT FILES -->
  <script src="config.js"></script>
  <script src="supabase.js"></script>
  <script src="script.js"></script>


  <!-- LOGIN LOGIC -->
  <script>

    (function () {

      'use strict';


      /* ==========================================
         ELEMENTS
         ========================================== */

      var form =
        document.getElementById(
          'admin-login-form'
        );


      var emailInput =
        document.getElementById(
          'email'
        );


      var passwordInput =
        document.getElementById(
          'password'
        );


      var emailError =
        document.getElementById(
          'email-error'
        );


      var passwordError =
        document.getElementById(
          'password-error'
        );


      var loginButton =
        document.getElementById(
          'login-button'
        );


      var googleButton =
        document.getElementById(
          'google-login-button'
        );


      var loginMessage =
        document.getElementById(
          'login-message'
        );


      /* ==========================================
         MESSAGE
         ========================================== */

      function showMessage(
        message,
        type
      ) {

        loginMessage.hidden = false;

        loginMessage.className =
          'notice notice-' +
          (type || 'info');

        loginMessage.textContent =
          message;

      }


      function hideMessage() {

        loginMessage.hidden = true;

        loginMessage.className = '';

        loginMessage.textContent = '';

      }


      /* ==========================================
         CLEAR ERRORS
         ========================================== */

      function clearErrors() {

        emailError.textContent = '';

        passwordError.textContent = '';

        hideMessage();

      }


      /* ==========================================
         EMAIL VALIDATION
         ========================================== */

      function isValidEmail(email) {

        return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
          .test(email);

      }


      /* ==========================================
         VERIFY ADMIN ROLE
         ========================================== */

      async function verifyAdmin(user) {

        if (!user) {

          return false;

        }


        try {

          var result =
            await window.supabaseClient

              .from('profiles')

              .select(
                `
                id,
                full_name,
                role
                `
              )

              .eq(
                'id',
                user.id
              )

              .maybeSingle();


          if (result.error) {

            throw result.error;

          }


          if (!result.data) {

            showMessage(
              'Profile was not found for this account.',
              'error'
            );

            await window.supabaseClient
              .auth
              .signOut();

            return false;

          }


          if (
            result.data.role !==
            'admin'
          ) {

            showMessage(
              'Access denied. This account does not have Admin permission.',
              'error'
            );


            await window.supabaseClient
              .auth
              .signOut();


            return false;

          }


          return true;

        }

        catch (error) {

          console.error(
            'Admin verification error:',
            error
          );


          showMessage(
            error.message ||
            'Unable to verify Admin permission.',
            'error'
          );


          return false;

        }

      }


      /* ==========================================
         GO TO DASHBOARD
         ========================================== */

      function goToDashboard() {

        var returnPage =
          sessionStorage.getItem(
            'britTunaAdminReturnTo'
          );


        /*
         * Only allow known local Admin pages.
         * This prevents unsafe external redirects.
         */

        var allowedPages = [

          'admin-dashboard.html',

          'seller-applications.html',

          'sellers.html',

          'products.html',

          'orders.html'

        ];


        if (
          returnPage &&
          allowedPages.includes(
            returnPage
          )
        ) {

          sessionStorage.removeItem(
            'britTunaAdminReturnTo'
          );


          window.location.replace(
            returnPage
          );


          return;

        }


        window.location.replace(
          'admin-dashboard.html'
        );

      }


      /* ==========================================
         EMAIL / PASSWORD LOGIN
         ========================================== */

      form.addEventListener(

        'submit',

        async function (event) {

          event.preventDefault();


          clearErrors();


          var email =
            emailInput.value
              .trim();


          var password =
            passwordInput.value;


          var valid = true;


          if (!email) {

            emailError.textContent =
              'Email address is required.';

            valid = false;

          }

          else if (
            !isValidEmail(email)
          ) {

            emailError.textContent =
              'Enter a valid email address.';

            valid = false;

          }


          if (!password) {

            passwordError.textContent =
              'Password is required.';

            valid = false;

          }


          if (!valid) {

            return;

          }


          loginButton.disabled = true;

          googleButton.disabled = true;

          loginButton.textContent =
            'Signing in...';


          try {

            var result =
              await window.supabaseClient
                .auth
                .signInWithPassword({

                  email:
                    email,

                  password:
                    password

                });


            if (result.error) {

              throw result.error;

            }


            if (
              !result.data ||
              !result.data.user
            ) {

              throw new Error(
                'Login failed.'
              );

            }


            var isAdmin =
              await verifyAdmin(
                result.data.user
              );


            if (!isAdmin) {

              return;

            }


            showMessage(
              'Admin login successful.',
              'success'
            );


            goToDashboard();

          }

          catch (error) {

            console.error(
              'Admin login error:',
              error
            );


            showMessage(
              error.message ||
              'Unable to login.',
              'error'
            );

          }

          finally {

            loginButton.disabled = false;

            googleButton.disabled = false;

            loginButton.textContent =
              'Login as Admin';

          }

        }

      );


      /* ==========================================
         GOOGLE LOGIN
         ========================================== */

      googleButton.addEventListener(

        'click',

        async function () {

          clearErrors();


          googleButton.disabled = true;

          loginButton.disabled = true;

          googleButton.textContent =
            'Opening Google...';


          try {

            /*
             * IMPORTANT:
             *
             * window.location.origin automatically
             * uses the website where this Admin
             * index.html is running.
             *
             * Production:
             * https://brit-tuna-admin.vercel.app/
             *
             * It DOES NOT redirect to the
             * main Brit.Tuna customer website.
             */

            var adminPortalUrl =
              window.location.origin + '/';


            var result =
              await window.supabaseClient
                .auth
                .signInWithOAuth({

                  provider:
                    'google',

                  options: {

                    redirectTo:
                      adminPortalUrl,

                    queryParams: {

                      access_type:
                        'offline',

                      prompt:
                        'select_account'

                    }

                  }

                });


            if (result.error) {

              throw result.error;

            }

          }

          catch (error) {

            console.error(
              'Google Admin login error:',
              error
            );


            showMessage(
              error.message ||
              'Unable to start Google login.',
              'error'
            );


            googleButton.disabled = false;

            loginButton.disabled = false;

            googleButton.textContent =
              'Continue with Google';

          }

        }

      );


      /* ==========================================
         CHECK EXISTING SESSION
         ========================================== */

      async function checkExistingSession() {

        try {

          var result =
            await window.supabaseClient
              .auth
              .getSession();


          if (result.error) {

            throw result.error;

          }


          var session =
            result.data
              ? result.data.session
              : null;


          if (
            !session ||
            !session.user
          ) {

            return;

          }


          /*
           * User may have just returned
           * from Google OAuth.
           *
           * Now verify profiles.role.
           */

          var isAdmin =
            await verifyAdmin(
              session.user
            );


          if (isAdmin) {

            showMessage(
              'Admin verified. Opening dashboard...',
              'success'
            );


            goToDashboard();

          }

        }

        catch (error) {

          console.error(
            'Session check error:',
            error
          );


          showMessage(
            error.message ||
            'Unable to check login session.',
            'error'
          );

        }

      }


      /* ==========================================
         START
         ========================================== */

      if (
        !window.supabaseClient
      ) {

        showMessage(
          'Supabase configuration was not loaded.',
          'error'
        );


        loginButton.disabled = true;

        googleButton.disabled = true;

        return;

      }


      checkExistingSession();


    })();

  </script>


</body>

</html>
